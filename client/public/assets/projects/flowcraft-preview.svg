<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f0f10"/>
  <!-- Canvas dot grid pattern -->
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2d2d30"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#dotGrid)"/>

  <!-- Connecting curves -->
  <path d="M 220 220 C 320 220, 320 160, 420 160" stroke="#B88A62" stroke-width="2.5" fill="none" stroke-dasharray="6,4"/>
  <path d="M 220 220 C 320 220, 320 310, 420 310" stroke="#B8DDE8" stroke-width="2.5" fill="none"/>

  <!-- Flowcraft node 1 -->
  <g transform="translate(110, 180)">
    <rect width="140" height="80" rx="8" fill="#1c1c1f" stroke="#383840" stroke-width="1.5"/>
    <text x="20" y="36" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Root Trigger</text>
    <text x="20" y="56" font-family="'Inter', sans-serif" font-size="11" fill="#888890">onUserAction()</text>
    <circle cx="140" cy="40" r="4" fill="#B88A62"/>
  </g>

  <!-- Flowcraft node 2 -->
  <g transform="translate(420, 120)">
    <rect width="170" height="80" rx="8" fill="#1c1c1f" stroke="#383840" stroke-width="1.5"/>
    <text x="20" y="36" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#ffffff">State Dispatcher</text>
    <text x="20" y="56" font-family="'Inter', sans-serif" font-size="11" fill="#B88A62">60 FPS Animation</text>
    <circle cx="0" cy="40" r="4" fill="#B88A62"/>
  </g>

  <!-- Flowcraft node 3 -->
  <g transform="translate(420, 270)">
    <rect width="170" height="80" rx="8" fill="#1c1c1f" stroke="#383840" stroke-width="1.5"/>
    <text x="20" y="36" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#ffffff">Canvas Viewport</text>
    <text x="20" y="56" font-family="'Inter', sans-serif" font-size="11" fill="#B8DDE8">Dirty Rect Culling</text>
    <circle cx="0" cy="40" r="4" fill="#B8DDE8"/>
  </g>

  <text x="60" y="70" font-family="'Instrument Serif', Georgia, serif" font-size="32" fill="#F7F7F5">Flowcraft Interactive Studio</text>
  <text x="60" y="94" font-family="'Inter', sans-serif" font-size="12" fill="#777777" letter-spacing="1.5">INFINITE HIGH-FPS CANVAS GRAPH WORKSPACE</text>
</svg>
